<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Astoria Kava — меню</title>
  <meta name="description" content="Astoria Kava — меню кавʼярні та Instagram." />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/main.js" defer></script>
</head>

<body>
  <!-- Верхня панель: тільки назва кавʼярні -->
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#top" aria-label="Astoria Kava">
        <span class="brand-main">ASTORIA</span>
        <span class="brand-sub">KAVA</span>
      </a>
    </div>
  </header>

  <!-- Головний екран -->
  <main class="hero" id="top">
    <div class="container hero-inner">
      <p class="eyebrow">кава з історією</p>

      <h1>Astoria<br>Kava</h1>

      <p class="hero-text">
        Місце, де смак має характер.
      </p>

      <div class="hero-actions">
        <a class="button button-primary" href="#menu">Переглянути меню</a>
        <a class="button button-secondary" href="https://instagram.com/astoria.kava" target="_blank" rel="noopener">
          Instagram
        </a>
      </div>
    </div>
  </main>

  <!-- Меню. Дані беруться з data/menu.json -->
  <section class="menu-section" id="menu">
    <div class="container">
      <div class="section-heading">
        <p>меню</p>
        <h2>Що сьогодні будемо?</h2>
      </div>

      <div class="menu-grid" id="menuGrid"></div>
    </div>
  </section>

  <!-- Низ сайту -->
  <footer class="footer">
    <div class="container">
      <p>ASTORIA KAVA · LIFE BEGINS AFTER COFFEE</p>
    </div>
  </footer>
</body>
</html>
